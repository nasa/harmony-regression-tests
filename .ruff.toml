required-version = ">=0.16.4"

[format]
quote-style = "preserve"

# Lint config to preserve the existing < v0.16 ruff rules
# https://astral.sh/blog/ruff-v0.16.0#better-default-rule-set
# In the future each test suite can migrate at their own speed. by adding
# another .ruff.toml file in their test directory.
[lint]
select = ["E4", "E7", "E9", "F"]
